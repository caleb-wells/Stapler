appId: com.calebwells.stapler
productName: Stapler
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
publish:
  provider: github
  owner: caleb-wells
  repo: Stapler
win:
  artifactName: ${productName}-Setup-${version}.${ext}
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: [dmg]
  category: public.app-category.productivity
linux:
  target: [AppImage]
  category: Graphics

toolsets:
  nsis: "1.2.1"
