appId: com.calebwells.imgtopdf
productName: Image to PDF
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: [dmg]
  category: public.app-category.productivity
linux:
  target: [AppImage]
  category: Graphics
